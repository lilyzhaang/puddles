# Side-photo windows on the home page. See docs/adding-a-photo.md.
#   side:  left or right margin
#   top:   how far down the page, in percent. Within a side, leave ~28 below a
#          portrait photo and ~18 below a landscape one so they never touch.
#   x:     how far in from the page edge, as a fraction of the margin
#   w:     how wide, as a fraction of the margin (x + w must stay under 1);
#          capped at 190px so very wide screens don't pile photos together
#   ratio: width/height of the image, e.g. "2/3" for portrait, "3/2" for landscape
#   speed: how slowly it drifts (0.27 - 0.32). Within a side, make speeds go UP
#          from top to bottom so windows spread apart as you scroll, never collide.

# left margin
- side: left
  top: 4
  x: 0.14
  w: 0.50
  ratio: "2/3"
  speed: 0.27
  title: lz_1.jpg
