<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v=4">
</head>
<body>
<header>
  <div class="headbar">
    <div class="logotype">{{ site.title | upcase }}<span>.log</span></div>
    <nav class="mono">
      <a href="{{ '/' | relative_url }}#about">about</a>
      <a href="{{ '/' | relative_url }}#projects">projects</a>
      <a href="{{ '/musings/' | relative_url }}">musings</a>
      <button class="theme-btn" id="theme-toggle" aria-label="Toggle theme">◐</button>
    </nav>
  </div>
</header>
<main>
{{ content }}
</main>
<footer>
  <div class="foot-row">
    <span>built with claude · <a href="{{ site.github.repository_url | default: '#' }}">view source</a></span>
    <span class="counter">© {{ site.time | date: "%Y" }}</span>
  </div>
</footer>
<script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
</body>
</html>
